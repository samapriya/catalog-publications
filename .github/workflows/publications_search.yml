name: Dimensions Publications Search
on:
  workflow_dispatch:
    inputs:
      aws_waf_token:
        description: 'aws-waf-token cookie (from browser DevTools or local script)'
        required: true
        type: string
      session_cookie:
        description: 'session cookie (from local script output)'
        required: false
        type: string
      auth_ticket:
        description: 'uber_auth_tkt cookie (from local script output)'
        required: false
        type: string
      csrf_token:
        description: 'x-csrf-token (from local script output)'
        required: false
        type: string
  # schedule:
  #   - cron: '15 16 * * *'

jobs:
  search_dimensions:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Dimensions search script
        uses: jannekem/run-python-script-action@v1
        env:
          DIMENSIONS_EMAIL: ${{ secrets.DIMENSIONS_EMAIL }}
          DIMENSIONS_PASSWORD: ${{ secrets.DIMENSIONS_PASSWORD }}
          # From secrets (used for scheduled runs)
          DIMENSIONS_AWS_WAF_TOKEN: ${{ secrets.DIMENSIONS_AWS_WAF_TOKEN }}
          DIMENSIONS_SESSION: ${{ secrets.DIMENSIONS_SESSION }}
          DIMENSIONS_AUTH_TICKET: ${{ secrets.DIMENSIONS_AUTH_TICKET }}
          DIMENSIONS_CSRF_TOKEN: ${{ secrets.DIMENSIONS_CSRF_TOKEN }}
          # From manual inputs (override secrets when provided)
          INPUT_AWS_WAF_TOKEN: ${{ inputs.aws_waf_token }}
          INPUT_SESSION: ${{ inputs.session_cookie }}
          INPUT_AUTH_TICKET: ${{ inputs.auth_ticket }}
          INPUT_CSRF_TOKEN: ${{ inputs.csrf_token }}
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
        with:
          script: |
            import json
            import logging
            import os
            import re
            import time
            import base64
            from datetime import datetime
            from typing import Any, Dict, List, Tuple, Optional

            import requests

            logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')
            logger = logging.getLogger(__name__)

            def extract_csrf_from_session(session_cookie: str) -> Optional[str]:
                try:
                    parts = session_cookie.split('N', 1)
                    if len(parts) > 1:
                        candidate = 'N' + parts[1]
                        padding = 4 - len(candidate) % 4
                        if padding != 4:
                            candidate += '=' * padding
                        try:
                            decoded = base64.b64decode(candidate).decode('utf-8', errors='ignore')
                            csrf_match = re.search(r'"_csrft_":\s*"([a-f0-9]+)"', decoded)
                            if csrf_match:
                                return csrf_match.group(1)
                        except Exception:
                            pass
                    hex_matches = re.findall(r'[a-f0-9]{40}', session_cookie)
                    if hex_matches:
                        return hex_matches[0]
                    return None
                except Exception as e:
                    logger.error(f"Error extracting CSRF token: {e}")
                    return None

            def get_tokens() -> Tuple[Dict[str, str], str]:
                """
                Resolve tokens with priority:
                1. Manual inputs (from workflow_dispatch) 
                2. Login flow (using email/password + WAF token from secrets)
                """
                # Manual inputs take priority
                input_waf = os.getenv('INPUT_AWS_WAF_TOKEN', '').strip()
                input_session = os.getenv('INPUT_SESSION', '').strip()
                input_ticket = os.getenv('INPUT_AUTH_TICKET', '').strip()
                input_csrf = os.getenv('INPUT_CSRF_TOKEN', '').strip()

                if input_waf and input_session and input_ticket and input_csrf:
                    logger.info("Using manually provided tokens from workflow_dispatch inputs")
                    return {
                        "aws-waf-token": input_waf,
                        "session": input_session,
                        "uber_auth_tkt": input_ticket,
                    }, input_csrf

                # Fall back to login flow
                logger.info("No manual inputs provided, attempting login flow...")
                
                # Use input WAF token if provided, otherwise fall back to secret
                aws_waf_token = input_waf or os.getenv('DIMENSIONS_AWS_WAF_TOKEN', '').strip()
                email = os.getenv('DIMENSIONS_EMAIL', '').strip()
                password = os.getenv('DIMENSIONS_PASSWORD', '').strip()

                if not aws_waf_token:
                    raise RuntimeError("No aws-waf-token available (neither manual input nor secret)")
                if not email or not password:
                    raise RuntimeError("DIMENSIONS_EMAIL and DIMENSIONS_PASSWORD secrets required for login flow")

                return login_to_dimensions(email, password, aws_waf_token)

            def login_to_dimensions(email: str, password: str, aws_waf_token: str) -> Tuple[Dict, str]:
                session = requests.Session()
                
                base_headers = {
                    "accept-language": "en-US,en;q=0.9",
                    "dnt": "1",
                    "sec-ch-ua": '"Chromium";v="148", "Brave";v="148", "Not/A)Brand";v="99"',
                    "sec-ch-ua-mobile": "?0",
                    "sec-ch-ua-platform": '"Windows"',
                    "sec-gpc": "1",
                    "user-agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/148.0.0.0 Safari/537.36",
                }
                
                session.cookies.set("aws-waf-token", aws_waf_token, domain="app.dimensions.ai")
                
                logger.info("Step 1: Getting landing page...")
                landing = session.get(
                    "https://app.dimensions.ai/auth/base/landing?redirect=%2Fdiscover",
                    headers={**base_headers, "accept": "text/html,application/xhtml+xml,*/*;q=0.8"},
                    timeout=30
                )
                landing.raise_for_status()
                
                initial_session = session.cookies.get("session")
                if not initial_session:
                    raise RuntimeError("No session cookie from landing page - WAF token may be expired")
                
                logger.info("Step 2: Extracting CSRF token...")
                csrf_token = extract_csrf_from_session(initial_session)
                if not csrf_token:
                    raise RuntimeError("Could not extract CSRF token from session")
                
                logger.info("Step 3: Logging in...")
                login_resp = session.post(
                    "https://app.dimensions.ai/auth/dimensions/login/auth.json?redirect=%2Fdiscover",
                    headers={
                        **base_headers,
                        "accept": "application/json",
                        "content-type": "application/json",
                        "origin": "https://app.dimensions.ai",
                        "referer": "https://app.dimensions.ai/auth/base/landing?redirect=%2Fdiscover",
                        "x-csrf-token": csrf_token,
                        "x-requested-with": "XMLHttpRequest",
                    },
                    json={"agreement_signed": False, "password": password, "username": email},
                    timeout=30
                )
                
                if login_resp.status_code != 200:
                    raise RuntimeError(f"Login failed ({login_resp.status_code}): {login_resp.text[:200]}")
                
                auth_session = session.cookies.get("session")
                auth_ticket = session.cookies.get("uber_auth_tkt")
                
                if not auth_ticket:
                    raise RuntimeError("No uber_auth_tkt after login - check credentials or WAF token")
                
                fresh_csrf = extract_csrf_from_session(auth_session) if auth_session else csrf_token
                logger.info("Login successful")
                
                return {
                    "aws-waf-token": aws_waf_token,
                    "session": auth_session,
                    "uber_auth_tkt": auth_ticket,
                }, fresh_csrf

            class DimensionsSearcher:
                def __init__(self, headers: Dict[str, str], cookies: Dict[str, str], base_url: str):
                    self.headers = headers
                    self.cookies = cookies
                    self.base_url = base_url
                    self.all_results = []
                    self.search_stats = {}

                def send_gotify_notification(self, title: str, message: str, priority: int = 5):
                    gotify_url = os.getenv('GOTIFY_URL')
                    gotify_token = os.getenv('GOTIFY_TOKEN')
                    if not gotify_url or not gotify_token:
                        return
                    if not gotify_url.endswith('/'):
                        gotify_url += '/'
                    try:
                        requests.post(
                            f"{gotify_url}message?token={gotify_token}",
                            json={"title": title, "message": message, "priority": priority},
                            timeout=10
                        ).raise_for_status()
                        logger.info(f"Gotify notification sent: {title}")
                    except Exception as e:
                        logger.error(f"Gotify notification failed: {e}")

                @staticmethod
                def clean_html_markup(text: str) -> str:
                    if not text or not isinstance(text, str):
                        return text
                    cleaned = re.sub(r'<mark class="search-keyword">', '', text)
                    cleaned = re.sub(r'</mark>', '', cleaned)
                    cleaned = re.sub(r'<[^>]+>', '', cleaned)
                    return cleaned.strip()

                def calculate_token_relevance_score(self, doc: Dict[str, Any], search_text: str) -> Dict[str, float]:
                    title = self.clean_html_markup(doc.get('title', '')).lower()
                    search_cleaned = search_text.replace('"', '').strip().lower()
                    stop_words = {'the', 'a', 'an', 'and', 'or', 'but', 'in', 'on', 'at', 'to', 'for', 'of', 'with', 'by', 'from'}
                    search_tokens = [w for w in search_cleaned.split() if w not in stop_words and len(w) > 2]
                    title_tokens = [w for w in title.split() if w not in stop_words and len(w) > 2]
                    scores = {'exact_matches': 0, 'match_ratio': 0.0, 'consecutive_bonus': 0.0,
                              'position_bonus': 0.0, 'highlighting_bonus': 0.0, 'combined_score': 0.0}
                    if not search_tokens:
                        return scores
                    exact_matches = len(set(search_tokens) & set(title_tokens))
                    match_ratio = exact_matches / len(search_tokens)
                    scores['exact_matches'] = exact_matches
                    scores['match_ratio'] = match_ratio
                    consecutive_bonus = sum(
                        0.2 for i in range(len(search_tokens) - 1)
                        if f"{search_tokens[i]} {search_tokens[i+1]}" in title
                    )
                    scores['consecutive_bonus'] = consecutive_bonus
                    if search_tokens and title_tokens:
                        positions = [title_tokens.index(t) for t in search_tokens if t in title_tokens]
                        if positions:
                            scores['position_bonus'] = max(0, 1.0 - (min(positions) / len(title_tokens)))
                    if '<mark class="search-keyword">' in doc.get('title', ''):
                        scores['highlighting_bonus'] = 2.0
                    scores['combined_score'] = (
                        match_ratio * 10 + consecutive_bonus +
                        scores['highlighting_bonus'] + scores['position_bonus']
                    )
                    return scores

                def make_search_request(self, search_text: str, search_description: str = "", search_field: str = "full_search") -> Dict[str, Any]:
                    params = {"search_mode": "content", "search_text": search_text,
                              "search_type": "kws", "search_field": search_field, "order": "date"}
                    try:
                        logger.info(f"Searching: {search_text} [{search_field}]")
                        response = requests.get(self.base_url, params=params, headers=self.headers, cookies=self.cookies)
                        response.raise_for_status()
                        if not response.text.strip():
                            self.search_stats[search_text] = {'description': search_description, 'search_field': search_field,
                                                               'count': 0, 'retrieved': 0, 'filtered': 0, 'error': 'Empty response'}
                            return {'count': 0, 'docs': []}
                        data = response.json()
                        count = data.get('count', 0)
                        docs = data.get('docs', [])
                        filtered_docs = self.filter_and_select_best_docs(docs, search_field, search_text)
                        logger.info(f"  {count} total → {len(filtered_docs)} after filtering")
                        self.search_stats[search_text] = {'description': search_description, 'search_field': search_field,
                                                           'count': count, 'retrieved': len(docs), 'filtered': len(filtered_docs)}
                        data['docs'] = filtered_docs
                        return data
                    except Exception as e:
                        logger.error(f"Error searching '{search_text}': {e}")
                        self.search_stats[search_text] = {'description': search_description, 'search_field': search_field,
                                                           'count': 0, 'retrieved': 0, 'filtered': 0, 'error': str(e)}
                        return {'count': 0, 'docs': []}

                def filter_and_select_best_docs(self, docs, search_field="full_search", search_text=""):
                    if not docs:
                        return []
                    allowed_types = {"article", "preprint", "book", "chapter"}
                    filtered = [d for d in docs if d.get('pub_class_id') in allowed_types]
                    if not filtered:
                        return []
                    groups = {}
                    for doc in filtered:
                        title = self.clean_html_markup(doc.get('title', '')).lower().strip()
                        if title:
                            groups.setdefault(title, []).append(doc)
                    selected = [
                        g[0] if len(g) == 1 else self.select_best_document(g)
                        for g in groups.values()
                    ]
                    if search_field == "text_search" and search_text:
                        for doc in selected:
                            scores = self.calculate_token_relevance_score(doc, search_text)
                            doc['_relevance_scores'] = scores
                            doc['_combined_relevance'] = scores['combined_score']
                        selected.sort(key=lambda x: (x.get('_combined_relevance', 0), x.get('score', 0)), reverse=True)
                        if selected:
                            top = selected[0]
                            s = top.get('_relevance_scores', {})
                            logger.info(f"  Best: {self.clean_html_markup(top.get('title', ''))} "
                                       f"(ratio={s.get('match_ratio',0):.2f}, combined={s.get('combined_score',0):.2f})")
                        return selected[:1]
                    selected.sort(key=lambda x: x.get('score', 0), reverse=True)
                    return selected

                def select_best_document(self, doc_group):
                    for pub_type in ['article', 'book', 'chapter', 'preprint']:
                        docs = [d for d in doc_group if d.get('pub_class_id') == pub_type]
                        if docs:
                            return max(docs, key=lambda x: x.get('score', 0))
                    return max(doc_group, key=lambda x: x.get('score', 0))

                def search_multiple_terms(self, search_terms, sleep_duration=2.0):
                    for i, term_info in enumerate(search_terms):
                        result = self.make_search_request(term_info['term'],
                                                          term_info.get('description', term_info.get('category', '')),
                                                          "full_search")
                        if result.get('docs'):
                            self.all_results.extend(result['docs'])
                        if i < len(search_terms) - 1:
                            time.sleep(sleep_duration)

                def fetch_and_search_scholar_diff(self, url, sleep_duration=2.0):
                    try:
                        response = requests.get(url, timeout=30)
                        response.raise_for_status()
                        titles = response.json()
                        logger.info(f"Found {len(titles)} scholar diff titles")
                        for i, title in enumerate(titles):
                            result = self.make_search_request(title, "Scholar Diff Title", "text_search")
                            if result.get('docs'):
                                self.all_results.extend(result['docs'])
                            if i < len(titles) - 1:
                                time.sleep(sleep_duration)
                    except Exception as e:
                        logger.error(f"Scholar diff error: {e}")

                def filter_publication_fields(self, pub):
                    result = {
                        'title': self.clean_html_markup(pub.get('title')),
                        'author_list': self.clean_html_markup(pub.get('author_list') or pub.get('editor_list')),
                        'journal_title': self.clean_html_markup(pub.get('journal_title')),
                        'source_title': self.clean_html_markup(pub.get('source_title')),
                        'doi': self.clean_html_markup(pub.get('doi')),
                        'short_abstract': self.clean_html_markup(pub.get('short_abstract')),
                    }
                    dates = [pub.get(f) for f in ['print_pub_date', 'pub_date', 'online_pub_date'] if pub.get(f)]
                    result['publication_date'] = min(dates, key=str) if dates else None
                    return result

                def remove_duplicates(self):
                    seen, unique = set(), []
                    for doc in self.all_results:
                        if (doc_id := doc.get('id')) and doc_id not in seen:
                            seen.add(doc_id)
                            unique.append(self.filter_publication_fields(doc))
                    logger.info(f"Deduplicated: {len(self.all_results)} → {len(unique)} unique")
                    return unique

                def save_results(self, filename="dimensions_filtered_results.json"):
                    unique = self.remove_duplicates()
                    for fn in [filename, "dimensions_filtered_results_latest.json"]:
                        with open(fn, 'w', encoding='utf-8') as f:
                            json.dump(unique, f, indent=2, ensure_ascii=False)
                    return filename

                def save_detailed_results(self, filename="dimensions_detailed_results.json"):
                    seen, unique_full = set(), []
                    for doc in self.all_results:
                        if (doc_id := doc.get('id')) and doc_id not in seen:
                            seen.add(doc_id)
                            unique_full.append(doc)
                    output = {'search_metadata': {'total_searches': len(self.search_stats),
                                                   'total_results_before_dedup': len(self.all_results),
                                                   'total_unique_results': len(unique_full),
                                                   'search_timestamp': datetime.now().isoformat(),
                                                   'search_statistics': self.search_stats},
                              'unique_publications': unique_full}
                    for fn in [filename, "dimensions_detailed_results_latest.json"]:
                        with open(fn, 'w', encoding='utf-8') as f:
                            json.dump(output, f, indent=2, ensure_ascii=False)
                    return filename

                def save_failed_searches(self, filename="dimensions_failed_searches.json"):
                    failed = {k: v for k, v in self.search_stats.items()
                              if 'error' in v or v.get('count', 0) == 0}
                    if not failed:
                        return None
                    output = {'failed_search_metadata': {'total_failed_searches': len(failed),
                                                          'export_timestamp': datetime.now().isoformat()},
                              'failed_searches': failed}
                    for fn in [filename, "dimensions_failed_searches_latest.json"]:
                        with open(fn, 'w', encoding='utf-8') as f:
                            json.dump(output, f, indent=2, ensure_ascii=False)
                    return filename

            def main():
                search_terms = [
                    {'term': '"gee-community-catalog.org"', 'category': 'Official URL', 'description': 'Main website URL'},
                    {'term': '"Awesome GEE Community Catalog"', 'category': 'Official Name', 'description': 'Full official name'},
                    {'term': '"awesome-gee-community-datasets"', 'category': 'Repository Name', 'description': 'GitHub repository name'},
                    {'term': '"Samapriya/Awesome-Gee-Community-Datasets"', 'category': 'GitHub Reference', 'description': 'Full GitHub path'},
                    {'term': '"github.com/samapriya/awesome-gee-community-datasets"', 'category': 'GitHub URL', 'description': 'Full GitHub URL'},
                    {'term': '"https://github.com/samapriya/awesome-gee-community-datasets"', 'category': 'GitHub URL with protocol', 'description': 'Complete GitHub URL'},
                    {'term': '"GEE Community Datasets"', 'category': 'Generic Name', 'description': 'Generic name for datasets'},
                    {'term': '"Earth Engine Community Catalog"', 'category': 'Specific Name', 'description': 'Earth Engine specific catalog reference'},
                    {'term': '"Earth Engine Community Catalogue"', 'category': 'Specific Name', 'description': 'Alternative spelling'},
                    {'term': '"GEE Community Assets"', 'category': 'Generic Name', 'description': 'Community assets reference'},
                    {'term': '"projects/sat-io"', 'category': 'Project Path', 'description': 'Satellite IO project path'},
                ]

                try:
                    auth_cookies, csrf_token = get_tokens()
                    logger.info(f"Tokens resolved. Cookies: {list(auth_cookies.keys())}")

                    headers = {
                        "accept": "application/json",
                        "accept-language": "en-US,en;q=0.9",
                        "cache-control": "no-cache, no-store, must-revalidate",
                        "content-type": "application/json",
                        "dnt": "1",
                        "expires": "0",
                        "operations": "sticky=nI4fV5SGzbBXzHTwShz8rDXqRjfK1VznwaNnBgpi",
                        "pragma": "no-cache",
                        "priority": "u=1, i",
                        "referer": "https://app.dimensions.ai/discover/publication_plus?search_mode=content&search_text=%22gee%20community%20catalog%22&search_type=kws&search_field=full_search&order=date",
                        "sec-ch-ua": '"Chromium";v="148", "Brave";v="148", "Not/A)Brand";v="99"',
                        "sec-ch-ua-mobile": "?0",
                        "sec-ch-ua-platform": '"Windows"',
                        "sec-fetch-dest": "empty",
                        "sec-fetch-mode": "cors",
                        "sec-fetch-site": "same-origin",
                        "sec-gpc": "1",
                        "user-agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/148.0.0.0 Safari/537.36",
                        "x-csrf-token": csrf_token,
                        "x-requested-with": "XMLHttpRequest",
                    }

                    searcher = DimensionsSearcher(headers, auth_cookies,
                                                  "https://app.dimensions.ai/discover/publication/results.json")

                    searcher.send_gotify_notification(
                        "🔍 Dimensions Search Started",
                        f"Starting search for {len(search_terms)} terms + scholar diff titles",
                        priority=3
                    )

                    searcher.search_multiple_terms(search_terms, sleep_duration=3.0)
                    time.sleep(3.0)

                    scholar_diff_url = "https://raw.githubusercontent.com/samapriya/catalog-publications/refs/heads/main/scholar_diff.json"
                    searcher.fetch_and_search_scholar_diff(scholar_diff_url, sleep_duration=3.0)

                    filtered_file = searcher.save_results()
                    detailed_file = searcher.save_detailed_results()
                    failed_file = searcher.save_failed_searches()

                    unique = searcher.remove_duplicates()
                    total = len(searcher.search_stats)
                    successful = len([s for s in searcher.search_stats.values() if s.get('filtered', 0) > 0])
                    failed_count = len([s for s in searcher.search_stats.values() if 'error' in s or s.get('count', 0) == 0])

                    searcher.send_gotify_notification(
                        "Dimensions Search Completed",
                        f"Done!\n\n• Publications found: {len(unique)}\n• Before dedup: {len(searcher.all_results)}\n• Searches: {total} ({successful} successful, {failed_count} failed)\n\n🕒 {datetime.now().strftime('%Y-%m-%d %H:%M:%S')} UTC",
                        priority=7
                    )

                    print("\n" + "="*50 + "\nSEARCH SUMMARY\n" + "="*50)
                    print(f"Unique publications: {len(unique)}")
                    print(f"Total before dedup: {len(searcher.all_results)}")
                    print(f"Filtered results: {filtered_file}")
                    print(f"Detailed results: {detailed_file}")
                    print(f"Failed searches: {failed_file or 'None'}")
                    print("\nDETAILED STATISTICS:")
                    print("-" * 80)
                    for term, stats in searcher.search_stats.items():
                        status = "✓" if stats.get('filtered', 0) > 0 else "ERROR" if 'error' in stats else "✗"
                        print(f"{status} {term[:35]:<35} [{stats.get('search_field','full_search')}] "
                              f"| {stats.get('count',0):>3} → {stats.get('retrieved',0):>3} → {stats.get('filtered',0):>3} "
                              f"| {stats.get('description','')}")

                    return filtered_file, detailed_file, failed_file

                except Exception as e:
                    try:
                        DimensionsSearcher({}, {}, "").send_gotify_notification(
                            "Dimensions Search Failed",
                            f"Failed!\n\n {str(e)}\n\n🕒 {datetime.now().strftime('%Y-%m-%d %H:%M:%S')} UTC",
                            priority=9
                        )
                    except Exception:
                        pass
                    raise

            if __name__ == "__main__":
                try:
                    filtered_file, detailed_file, failed_file = main()
                    print(f"\n Done! Results: {filtered_file}")
                except Exception as e:
                    logger.error(f"Script failed: {e}")
                    import
